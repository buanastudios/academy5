<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — BUANA ACADEMY Control Panel & SEO Manager</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      background-image: none;
    }
    .admin-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .admin-nav-bar {
      background: #1e293b;
      border-bottom: 2px solid #334155;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .seo-preview-google {
      background: #ffffff;
      color: #1a0dab;
      border: 1px solid #dfe1e5;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-top: 1rem;
      font-family: Arial, sans-serif;
    }
    .seo-preview-url {
      font-size: 0.85rem;
      color: #202124;
      margin-bottom: 0.25rem;
    }
    .seo-preview-title {
      font-size: 1.25rem;
      color: #1a0dab;
      font-weight: 500;
      cursor: pointer;
      text-decoration: underline;
      line-height: 1.3;
      margin-bottom: 0.35rem;
    }
    .seo-preview-desc {
      font-size: 0.9rem;
      color: #4d5156;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="admin-wrapper">
    <!-- Header -->
    <header class="admin-nav-bar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <div class="lego-brand-box" style="width:42px; height:42px; font-size:1.4rem;">🤖</div>
        <div>
          <h1 style="color:#fff; font-size:1.3rem; margin:0;">BUANA ACADEMY — Control Panel & CMS</h1>
          <div style="font-size:0.8rem; color:#94a3b8;">Kelola Konten, SEO Meta Tags, Jadwal Sesi, & Pendaftaran Siswa</div>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="admin-tabs">
        <button class="admin-tab-btn active" data-tab="overview">📊 Ringkasan</button>
        <button class="admin-tab-btn" data-tab="students">👥 Data Siswa & Resi</button>
        <button class="admin-tab-btn" data-tab="cms">✏️ Edit Konten</button>
        <button class="admin-tab-btn" data-tab="seo">🔍 SEO & Meta Tags</button>
        <button class="admin-tab-btn" data-tab="sessions">⏰ Jadwal & Kuota</button>
        <button class="admin-tab-btn" data-tab="faqs">❓ FAQ</button>
      </div>

      <div style="display:flex; align-items:center; gap:0.75rem;">
        <button id="btn-sound-toggle" class="sound-toggle-btn" onclick="window.buanaSound.toggleSound()" style="background:#0f172a; color:#fff; border-color:#334155;">
          🔊 Suara: ON
        </button>

        <a href="landscape.html" target="_blank" class="btn-lego btn-lego-yellow btn-sm" title="Buka Versi Widescreen">
          🖥️ Versi Widescreen
        </a>

        <a href="index.html" target="_blank" class="btn-lego btn-lego-blue btn-sm">
          🌐 Website Utama ➔
        </a>
      </div>
    </header>

    <!-- Main Container Content -->
    <main class="container" style="max-width:1300px; padding:2rem 1.5rem; flex-grow:1;">
      <div id="admin-tab-content">
        <!-- Rendered dynamically by admin.js -->
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
